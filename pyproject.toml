[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swissdocs-rag"
version = "0.1.0"
description = "Multilingual question answering over Swiss insurance and regulatory texts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "David Ouchtar"}]
dependencies = [
  "fastapi==0.163.2",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "httpx==0.28.1",
  "qdrant-client==1.20.0",
  "rank-bm25==0.2.2",
  "fastembed==0.9.1",
  "pypdf==7.1.0",
  "streamlit==1.67.0",
  "python-dotenv==1.2.4",
  "numpy==2.5.5",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[project.scripts]
swissdocs = "swissdocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "apps", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/swissdocs/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
