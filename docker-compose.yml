services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""
      CORPUS_PATH: data/sample/chunks.jsonl
      # The one-command demo quotes retrieved articles so it does not need a
      # generative model. Switch to ollama and point OLLAMA_BASE_URL at a
      # daemon (for example http://host.docker.internal:11434) for generation.
      LLM_BACKEND: extractive
      EMBEDDING_MODEL: intfloat/multilingual-e5-large
      EMBEDDING_BACKEND: fastembed
      MIN_DENSE_SCORE: "0.78"
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - embed_cache:/home/appuser/.cache

  ui:
    build: .
    command:
      - streamlit
      - run
      - apps/streamlit_app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"
    environment:
      SWISSDOCS_API_URL: http://api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  qdrant_data:
  embed_cache:
